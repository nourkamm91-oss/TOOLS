name: Generate Valid Text File

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  run-generator:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.x
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Generator Script
        run: python Valid.txt -c 200000 -f plain -o Valid.txt

      - name: Upload Valid.txt as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Valid-Numbers-TXT
          path: Valid.txt
          retention-days: 7
