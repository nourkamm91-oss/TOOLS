name: Auto-Generate US Phone Numbers

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  run-generator:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python 3.x
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Execute Generator Script
        run: |
          python app.py -c 100 -f e164 -o generated_numbers.csv

      - name: Upload CSV as downloadable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: us-phone-numbers-csv
          path: generated_numbers.csv
          retention-days: 7
