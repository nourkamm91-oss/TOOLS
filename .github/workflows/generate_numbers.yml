name: Bulk Auto-Generate 200K US Numbers

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  run-generator:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python 3.x
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run High-Volume Generator
        run: |
          python app.py -c 200000 -f e164 -o 200k_numbers.csv

      - name: Upload 200K CSV as downloadable Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: us-phone-numbers-200k-csv
          path: 200k_numbers.csv
          retention-days: 7
